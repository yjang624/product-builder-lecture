<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 추첨기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: linear-gradient(135deg, #fff8fb, #fdf2ff);
      --container-bg: #fff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      --text: #333;
      --desc: #666;
      --label: #777;
      --plus: #999;
      --history-bg: #fff8fc;
      --history-border: #f8d7e7;
      --history-item-bg: #fff;
      --history-item-border: #f5d8e7;
      --history-item-text: #555;
      --history-title: #c04d8a;
      --toggle-bg: #eee;
      --toggle-text: #555;
    }

    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #1a1a2e, #16213e);
      --container-bg: #1e1e2e;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      --text: #eee;
      --desc: #aaa;
      --label: #999;
      --plus: #777;
      --history-bg: #16213e;
      --history-border: #3a2a4a;
      --history-item-bg: #252535;
      --history-item-border: #3a2a4a;
      --history-item-text: #ccc;
      --history-title: #e87dc0;
      --toggle-bg: #333;
      --toggle-text: #eee;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      gap: 32px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .contact-section {
      width: 100%;
      max-width: 720px;
      background: var(--container-bg);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-section h2 {
      font-size: 1.5rem;
      color: #d85a9d;
      margin: 0 0 6px;
    }

    .contact-section .c-sub {
      font-size: 0.9rem;
      color: var(--desc);
      margin: 0 0 24px;
    }

    .c-field { margin-bottom: 16px; }

    .c-field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--label);
      margin-bottom: 6px;
    }

    .c-field label .req { color: #e05a9a; margin-left: 2px; }

    .c-field input,
    .c-field select,
    .c-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 14px;
      border: 1.5px solid var(--history-border);
      border-radius: 10px;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--text);
      background: var(--history-bg);
      outline: none;
      transition: border-color 0.2s;
    }

    .c-field input:focus,
    .c-field select:focus,
    .c-field textarea:focus { border-color: #d85a9d; }

    .c-field textarea { resize: vertical; min-height: 110px; }

    .c-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .c-success {
      display: none;
      text-align: center;
      padding: 16px 0;
    }

    .c-success .icon { font-size: 2.5rem; margin-bottom: 8px; }

    @media (max-width: 480px) {
      .c-row { grid-template-columns: 1fr; }
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--container-bg);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .toggle-btn {
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: none;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .toggle-btn:hover {
      transform: translateY(-1px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #d85a9d;
    }

    .desc {
      margin: 0 0 28px;
      color: var(--desc);
      line-height: 1.6;
    }

    .numbers-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      min-height: 72px;
    }

    .ball {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
      animation: pop 0.35s ease;
    }

    .plus {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--plus);
      margin: 0 2px;
    }

    .label {
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--label);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #ff7eb6, #d85a9d);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(216, 90, 157, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .history {
      margin-top: 28px;
      text-align: left;
      background: var(--history-bg);
      border: 1px solid var(--history-border);
      border-radius: 20px;
      padding: 18px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .history h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: var(--history-title);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow: auto;
    }

    .history-item {
      padding: 12px 14px;
      background: var(--history-item-bg);
      border-radius: 14px;
      border: 1px solid var(--history-item-border);
      font-size: 0.95rem;
      color: var(--history-item-text);
      line-height: 1.6;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 640px) {
      .ball {
        width: 52px;
        height: 52px;
        font-size: 1rem;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="toggle-btn" id="themeToggle">🌙 다크모드</button>
    </div>

    <h1>🎟 로또 추첨기</h1>
    <p class="desc">
      버튼을 누르면 1~45 사이 숫자 6개와 보너스 번호 1개를 랜덤으로 추첨해요.
    </p>

    <div class="label">당첨 번호</div>
    <div class="numbers-wrap" id="numbersWrap">
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="plus">+</div>
      <div class="ball" style="background:#999;">?</div>
    </div>

    <button id="drawBtn">번호 추첨하기</button>

    <div class="history">
      <h2>추첨 기록</h2>
      <div class="history-list" id="historyList">
        <div class="history-item">아직 추첨 기록이 없어요.</div>
      </div>
    </div>
  </div>

  <section class="contact-section">
    <div id="c-wrap">
      <h2>제휴 문의</h2>
      <p class="c-sub">아래 내용을 작성해 주시면 빠르게 검토 후 연락드리겠습니다.</p>
      <form id="c-form" action="https://formspree.io/f/mojyzpvd" method="POST">
        <div class="c-row">
          <div class="c-field">
            <label>이름 <span class="req">*</span></label>
            <input type="text" name="name" placeholder="홍길동" required />
          </div>
          <div class="c-field">
            <label>회사명 <span class="req">*</span></label>
            <input type="text" name="company" placeholder="(주)회사명" required />
          </div>
        </div>
        <div class="c-field">
          <label>이메일 <span class="req">*</span></label>
          <input type="email" name="email" placeholder="example@company.com" required />
        </div>
        <div class="c-field">
          <label>연락처</label>
          <input type="tel" name="phone" placeholder="010-0000-0000" />
        </div>
        <div class="c-field">
          <label>제휴 유형 <span class="req">*</span></label>
          <select name="type" required>
            <option value="" disabled selected>선택해 주세요</option>
            <option value="마케팅">마케팅 제휴</option>
            <option value="기술">기술 협력</option>
            <option value="콘텐츠">콘텐츠 제휴</option>
            <option value="투자">투자 / 파트너십</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="c-field">
          <label>문의 내용 <span class="req">*</span></label>
          <textarea name="message" placeholder="제휴 제안 내용을 자유롭게 작성해 주세요." required></textarea>
        </div>
        <input type="text" name="_gotcha" style="display:none" />
        <button type="submit" style="width:100%; margin-top:8px;">문의 보내기</button>
      </form>
    </div>
    <div class="c-success" id="c-success">
      <div class="icon">✅</div>
      <h3 style="color:#d85a9d; margin:0 0 8px;">문의가 접수되었습니다!</h3>
      <p style="color:var(--desc); font-size:0.9rem;">빠른 시일 내에 이메일로 연락드리겠습니다.</p>
    </div>
  </section>

  <script>
    const numbersWrap = document.getElementById("numbersWrap");
    const drawBtn = document.getElementById("drawBtn");
    const historyList = document.getElementById("historyList");
    const themeToggle = document.getElementById("themeToggle");
    const html = document.documentElement;

    themeToggle.addEventListener("click", () => {
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      themeToggle.textContent = isDark ? "🌙 다크모드" : "☀️ 라이트모드";
    });

    function getBallColor(num) {
      if (num <= 10) return "#f6c445";
      if (num <= 20) return "#6bb8ff";
      if (num <= 30) return "#ff7c7c";
      if (num <= 40) return "#9c8cff";
      return "#6ecb8b";
    }

    function drawLotto() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1);

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const mainNumbers = pool.slice(0, 6).sort((a, b) => a - b);
      const bonusNumber = pool[6];

      return { mainNumbers, bonusNumber };
    }

    function renderNumbers(mainNumbers, bonusNumber) {
      numbersWrap.innerHTML = "";

      mainNumbers.forEach((num) => {
        const ball = document.createElement("div");
        ball.className = "ball";
        ball.textContent = num;
        ball.style.background = getBallColor(num);
        numbersWrap.appendChild(ball);
      });

      const plus = document.createElement("div");
      plus.className = "plus";
      plus.textContent = "+";
      numbersWrap.appendChild(plus);

      const bonusBall = document.createElement("div");
      bonusBall.className = "ball";
      bonusBall.textContent = bonusNumber;
      bonusBall.style.background = "#444";
      numbersWrap.appendChild(bonusBall);
    }

    function addHistory(mainNumbers, bonusNumber) {
      const text = `${mainNumbers.join(", ")} + 보너스 ${bonusNumber}`;

      if (historyList.children.length === 1 && historyList.children[0].textContent.includes("아직 추첨 기록")) {
        historyList.innerHTML = "";
      }

      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = text;

      historyList.prepend(item);
    }

    drawBtn.addEventListener("click", () => {
      const { mainNumbers, bonusNumber } = drawLotto();
      renderNumbers(mainNumbers, bonusNumber);
      addHistory(mainNumbers, bonusNumber);
    });

    document.getElementById('c-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = '전송 중...';
      btn.disabled = true;
      try {
        const res = await fetch(e.target.action, {
          method: 'POST',
          body: new FormData(e.target),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          document.getElementById('c-wrap').style.display = 'none';
          document.getElementById('c-success').style.display = 'block';
        } else {
          alert('전송 실패. 잠시 후 다시 시도해 주세요.');
          btn.textContent = '문의 보내기';
          btn.disabled = false;
        }
      } catch {
        alert('네트워크 오류가 발생했습니다.');
        btn.textContent = '문의 보내기';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
