<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 추첨기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: linear-gradient(135deg, #fff8fb, #fdf2ff);
      --container-bg: #fff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      --text: #333;
      --desc: #666;
      --label: #777;
      --plus: #999;
      --history-bg: #fff8fc;
      --history-border: #f8d7e7;
      --history-item-bg: #fff;
      --history-item-border: #f5d8e7;
      --history-item-text: #555;
      --history-title: #c04d8a;
      --toggle-bg: #eee;
      --toggle-text: #555;
    }

    [data-theme="dark"] {
      --bg: linear-gradient(135deg, #1a1a2e, #16213e);
      --container-bg: #1e1e2e;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      --text: #eee;
      --desc: #aaa;
      --label: #999;
      --plus: #777;
      --history-bg: #16213e;
      --history-border: #3a2a4a;
      --history-item-bg: #252535;
      --history-item-border: #3a2a4a;
      --history-item-text: #ccc;
      --history-title: #e87dc0;
      --toggle-bg: #333;
      --toggle-text: #eee;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--container-bg);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: var(--shadow);
      text-align: center;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .toggle-btn {
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: none;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .toggle-btn:hover {
      transform: translateY(-1px);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: #d85a9d;
    }

    .desc {
      margin: 0 0 28px;
      color: var(--desc);
      line-height: 1.6;
    }

    .numbers-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
      min-height: 72px;
    }

    .ball {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.2rem;
      color: white;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
      animation: pop 0.35s ease;
    }

    .plus {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--plus);
      margin: 0 2px;
    }

    .label {
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--label);
    }

    button {
      border: none;
      background: linear-gradient(135deg, #ff7eb6, #d85a9d);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(216, 90, 157, 0.2);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    .history {
      margin-top: 28px;
      text-align: left;
      background: var(--history-bg);
      border: 1px solid var(--history-border);
      border-radius: 20px;
      padding: 18px;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .history h2 {
      margin: 0 0 14px;
      font-size: 1.05rem;
      color: var(--history-title);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 220px;
      overflow: auto;
    }

    .history-item {
      padding: 12px 14px;
      background: var(--history-item-bg);
      border-radius: 14px;
      border: 1px solid var(--history-item-border);
      font-size: 0.95rem;
      color: var(--history-item-text);
      line-height: 1.6;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(0.6);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @media (max-width: 640px) {
      .ball {
        width: 52px;
        height: 52px;
        font-size: 1rem;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button class="toggle-btn" id="themeToggle">🌙 다크모드</button>
    </div>

    <h1>🎟 로또 추첨기</h1>
    <p class="desc">
      버튼을 누르면 1~45 사이 숫자 6개와 보너스 번호 1개를 랜덤으로 추첨해요.
    </p>

    <div class="label">당첨 번호</div>
    <div class="numbers-wrap" id="numbersWrap">
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="ball" style="background:#ccc;">?</div>
      <div class="plus">+</div>
      <div class="ball" style="background:#999;">?</div>
    </div>

    <button id="drawBtn">번호 추첨하기</button>

    <div class="history">
      <h2>추첨 기록</h2>
      <div class="history-list" id="historyList">
        <div class="history-item">아직 추첨 기록이 없어요.</div>
      </div>
    </div>
  </div>

  <script>
    const numbersWrap = document.getElementById("numbersWrap");
    const drawBtn = document.getElementById("drawBtn");
    const historyList = document.getElementById("historyList");
    const themeToggle = document.getElementById("themeToggle");
    const html = document.documentElement;

    themeToggle.addEventListener("click", () => {
      const isDark = html.getAttribute("data-theme") === "dark";
      html.setAttribute("data-theme", isDark ? "light" : "dark");
      themeToggle.textContent = isDark ? "🌙 다크모드" : "☀️ 라이트모드";
    });

    function getBallColor(num) {
      if (num <= 10) return "#f6c445";
      if (num <= 20) return "#6bb8ff";
      if (num <= 30) return "#ff7c7c";
      if (num <= 40) return "#9c8cff";
      return "#6ecb8b";
    }

    function drawLotto() {
      const pool = Array.from({ length: 45 }, (_, i) => i + 1);

      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }

      const mainNumbers = pool.slice(0, 6).sort((a, b) => a - b);
      const bonusNumber = pool[6];

      return { mainNumbers, bonusNumber };
    }

    function renderNumbers(mainNumbers, bonusNumber) {
      numbersWrap.innerHTML = "";

      mainNumbers.forEach((num) => {
        const ball = document.createElement("div");
        ball.className = "ball";
        ball.textContent = num;
        ball.style.background = getBallColor(num);
        numbersWrap.appendChild(ball);
      });

      const plus = document.createElement("div");
      plus.className = "plus";
      plus.textContent = "+";
      numbersWrap.appendChild(plus);

      const bonusBall = document.createElement("div");
      bonusBall.className = "ball";
      bonusBall.textContent = bonusNumber;
      bonusBall.style.background = "#444";
      numbersWrap.appendChild(bonusBall);
    }

    function addHistory(mainNumbers, bonusNumber) {
      const text = `${mainNumbers.join(", ")} + 보너스 ${bonusNumber}`;

      if (historyList.children.length === 1 && historyList.children[0].textContent.includes("아직 추첨 기록")) {
        historyList.innerHTML = "";
      }

      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = text;

      historyList.prepend(item);
    }

    drawBtn.addEventListener("click", () => {
      const { mainNumbers, bonusNumber } = drawLotto();
      renderNumbers(mainNumbers, bonusNumber);
      addHistory(mainNumbers, bonusNumber);
    });
  </script>
</body>
</html>
